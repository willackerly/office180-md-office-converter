[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "office180-md-office-converter"
version = "0.2.0"
description = "Deterministic, provenance-aware Markdown and Microsoft Word conversion tools"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Will Ackerly" },
]
dependencies = [
  "python-docx==1.2.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup",
]

[project.urls]
Repository = "https://github.com/willackerly/office180-md-office-converter"

[project.scripts]
office180-md2docx = "md2docx:main"
office180-docx2md = "docx2md:main"

[tool.setuptools]
py-modules = ["md2docx", "docx2md"]
