<!doctype html>
<html lang="en" data-pptv-version="0.1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="pptv-agent-profile" content="pptv-agent/1">
  <title>Minimal PPTV deck</title>
</head>
<body>

<!--
  PPTV 0.1 vertical-slice fixture. Contracts C4 through C7 cover its source,
  patch, resolved-model, editor-pack, and deterministic PPTX canary paths.
-->

<script id="pptv-manifest" type="application/pptv+json">
{
  "pptv": "0.1",
  "title": "Minimal PPTV deck",
  "runtime": "pptv-browser/0.1",
  "theme": "light",
  "slides": [
    "cover",
    "architecture"
  ]
}
</script>

<main data-pptv-output></main>

<template data-pptv-slide="architecture">
  <svg id="architecture" viewBox="0 0 1600 900"
       data-pptv-layout="architecture"
       xmlns="http://www.w3.org/2000/svg">
    <rect id="architecture.background" class="slide-background"
          data-pptv-role="shape" data-pptv-export="native"
          x="0" y="0" width="1600" height="900"/>

    <text id="architecture.title" class="slide-title"
          data-pptv-role="text" data-pptv-export="native"
          data-pptv-frame="100 40 1400 120"
          data-pptv-line-step="77"
          x="100" y="120">System architecture</text>

    <line id="architecture.edge.client-policy" class="diagram-edge"
          data-pptv-role="connector" data-pptv-export="native"
          data-pptv-from="architecture.node.client"
          data-pptv-to="architecture.node.policy"
          x1="570" y1="450" x2="1030" y2="450"/>

    <g id="architecture.node.client" class="diagram-node"
       data-pptv-role="group" data-pptv-export="native">
      <rect id="architecture.node.client.panel" class="diagram-node__panel"
            data-pptv-role="shape" data-pptv-export="native"
            x="190" y="320" width="380" height="260"/>
      <text id="architecture.node.client.title" class="diagram-node__title"
            data-pptv-role="text" data-pptv-export="native"
            data-pptv-frame="190 390 380 120"
            data-pptv-line-step="51"
            x="380" y="465" text-anchor="middle">Client</text>
    </g>

    <g id="architecture.node.policy" class="diagram-node"
       data-pptv-role="group" data-pptv-export="native">
      <rect id="architecture.node.policy.panel" class="diagram-node__panel"
            data-pptv-role="shape" data-pptv-export="native"
            x="1030" y="320" width="380" height="260"/>
      <text id="architecture.node.policy.title" class="diagram-node__title"
            data-pptv-role="text" data-pptv-export="native"
            data-pptv-frame="1030 390 380 120"
            data-pptv-line-step="51"
            x="1220" y="465" text-anchor="middle">Policy service</text>
    </g>
  </svg>
</template>

<template data-pptv-slide="cover">
  <svg id="cover" viewBox="0 0 1600 900"
       data-pptv-layout="title"
       xmlns="http://www.w3.org/2000/svg">
    <rect id="cover.background" class="slide-background"
          data-pptv-role="shape" data-pptv-export="native"
          x="0" y="0" width="1600" height="900"/>
    <text id="cover.title" class="cover-title"
          data-pptv-role="text" data-pptv-export="native"
          data-pptv-frame="120 280 1360 160"
          data-pptv-line-step="116"
          x="120" y="410">Minimal PPTV deck</text>
    <text id="cover.subtitle" class="cover-subtitle"
          data-pptv-role="text" data-pptv-export="native"
          data-pptv-frame="125 445 1350 80"
          data-pptv-line-step="41"
          x="125" y="490">Manifest first. Slides declarative. Theme last.</text>
  </svg>
</template>

<script type="text/css" data-pptv-style="base">
.slide-background {
  fill: var(--pptv-background);
}

.cover-title {
  fill: var(--pptv-text-primary);
  font-family: var(--pptv-font-major);
  font-size: 96px;
  font-weight: 700;
}

.cover-subtitle {
  fill: var(--pptv-text-secondary);
  font-family: var(--pptv-font-major);
  font-size: 34px;
}

.slide-title {
  fill: var(--pptv-text-primary);
  font-family: var(--pptv-font-major);
  font-size: 64px;
  font-weight: 700;
}

.diagram-node__panel {
  fill: var(--pptv-surface-raised);
  stroke: var(--pptv-accent-1);
  stroke-width: 4;
}

.diagram-node__title {
  fill: var(--pptv-text-primary);
  font-family: var(--pptv-font-major);
  font-size: 42px;
  font-weight: 700;
}

.diagram-edge {
  stroke: var(--pptv-accent-1);
  stroke-width: 6;
}
</script>

<script type="text/css" data-pptv-theme="light">
:root {
  --pptv-background: #ffffff;
  --pptv-text-primary: #17211e;
  --pptv-text-secondary: #51605b;
  --pptv-surface-raised: #f2f5f4;
  --pptv-accent-1: #6f5cff;
  --pptv-font-major: Arial;
}
</script>

<script type="text/css" data-pptv-theme="dark">
:root {
  --pptv-background: #101714;
  --pptv-text-primary: #f5f7f6;
  --pptv-text-secondary: #b7c2bd;
  --pptv-surface-raised: #1b2521;
  --pptv-accent-1: #9a8cff;
  --pptv-font-major: Arial;
}
</script>

<script data-pptv-runtime="pptv-browser/0.1">
(() => {
  "use strict";

  const manifestNode = document.querySelector("#pptv-manifest");
  const output = document.querySelector("[data-pptv-output]");
  const manifest = JSON.parse(manifestNode.textContent);

  const baseStyleNode = document.querySelector('[data-pptv-style="base"]');
  if (!baseStyleNode) throw new Error("Missing PPTV base style");

  const themeNode = document.querySelector(
    `[data-pptv-theme="${CSS.escape(manifest.theme)}"]`
  );
  if (!themeNode) throw new Error(`Unknown PPTV theme: ${manifest.theme}`);

  const viewerStyle = document.createElement("style");
  viewerStyle.dataset.pptvViewerChrome = "";
  viewerStyle.textContent = `
html, body { margin: 0; background: #dfe5e2; }
[data-pptv-output] { display: grid; gap: 32px; padding: 32px; }
.pptv-slide {
  width: min(100%, 1280px);
  margin: 0 auto;
  box-shadow: 0 16px 48px rgb(0 0 0 / 24%);
}
.pptv-slide > svg { display: block; width: 100%; height: auto; }
`;
  document.head.append(viewerStyle);

  const activeStyle = document.createElement("style");
  activeStyle.dataset.pptvActiveTheme = manifest.theme;
  activeStyle.textContent = `${baseStyleNode.textContent}\n${themeNode.textContent}`;
  document.head.append(activeStyle);

  for (const slideRef of manifest.slides) {
    if (typeof slideRef === "object" && slideRef.hidden === true) continue;
    const id = typeof slideRef === "string" ? slideRef : slideRef.id;
    const source = document.querySelector(
      `template[data-pptv-slide="${CSS.escape(id)}"]`
    );
    if (!source) throw new Error(`Unknown PPTV slide: ${id}`);

    const section = document.createElement("section");
    section.className = "pptv-slide";
    section.dataset.pptvRenderedSlide = id;
    section.append(source.content.cloneNode(true));
    output.append(section);
  }
})();
</script>

</body>
</html>
