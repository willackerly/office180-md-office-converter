<svg xmlns="http://www.w3.org/2000/svg" data-vector180-version="0.1"
  id="multiline" viewBox="0 0 1600 900">
  <metadata data-vector180-metadata="vector180-atom-metadata/0.1">{"styleFamily":{"id":"office180.vector180.default","version":"1.0"}}</metadata>
  <rect id="multiline.background" data-vector180-role="shape" data-vector180-export="native"
    x="0" y="0" width="1600" height="900"
    fill="#ffffff" stroke="none"/>
  <text id="multiline.title" data-vector180-role="text" data-vector180-export="native"
    data-vector180-frame="100 60 1400 100"
    data-vector180-line-step="72"
    x="100" y="130"
    fill="#17211e" stroke="none" font-family="ABeeZee" font-size="56"
    font-weight="400" font-style="normal" text-anchor="start">One text box per text object</text>
  <text id="multiline.paragraph" data-vector180-role="text" data-vector180-export="native"
    data-vector180-frame="100 220 1400 150"
    data-vector180-line-step="48"
    fill="#17211e" stroke="none" font-family="ABeeZee" font-size="32"
    font-weight="400" font-style="normal" text-anchor="start">
    <tspan x="100" y="260">Every hard line stays exactly where it was authored,</tspan>
    <tspan x="100" y="308">yet PowerPoint shows a single editable text box</tspan>
    <tspan x="100" y="356">with one paragraph for each line.</tspan>
  </text>
  <text id="multiline.list" data-vector180-role="text" data-vector180-export="native"
    data-vector180-frame="100 430 1400 200"
    data-vector180-line-step="48"
    fill="#17211e" stroke="none" font-family="ABeeZee" font-size="32"
    font-weight="400" font-style="normal" text-anchor="start">
    <tspan x="100" y="470">- Lines share one anchor and one style</tspan>
    <tspan x="100" y="518">- Baselines advance by the declared line step</tspan>
    <tspan x="100" y="566"></tspan>
    <tspan x="100" y="614">- An empty hard line keeps its slot</tspan>
  </text>
  <text id="multiline.centered" data-vector180-role="text" data-vector180-export="native"
    data-vector180-frame="200 700 1200 110"
    data-vector180-line-step="48"
    fill="#17211e" stroke="none" font-family="ABeeZee" font-size="32"
    font-weight="400" font-style="normal" text-anchor="middle">
    <tspan x="800" y="740">Centered hard lines</tspan>
    <tspan x="800" y="788">share the middle anchor</tspan>
  </text>
</svg>
